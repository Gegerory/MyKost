[build]
command = "npm run build"
publish = "dist"
[functions]
directory = "netlify/functions"
[[redirects]]
from = "/manager/*"
to = "/manager/index.html"
status = 200
[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "private, no-store"
X-Content-Type-Options = "nosniff"
[dev]
command = "npm run dev -- --port 5173"
targetPort = 5173
port = 8889
framework = "#custom"
